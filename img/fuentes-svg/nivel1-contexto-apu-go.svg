nt-weight="normal" fill="#FFFFFF"><tspan x="270.0" dy="0">Estudiante</tspan><tspan x="270.0" dy="22.5">[Persona]</tspan><tspan x="270.0" dy="22.5"></tspan><tspan x="270.0" dy="22.5">Practica quechua y consulta su</tspan><tspan x="270.0" dy="22.5">avance.</tspan></text><rect x="560.0" y="200.0" width="380.0" height="190.0" rx="8" fill="#0B365B" stroke="none" stroke-width="1.5" /><text x="750.0" y="256.75" text-anchor="middle" font-family="DejaVu Sans" font-size="18.0" font-weight="normal" fill="#FFFFFF"><tspan x="750.0" dy="0">Docente</tspan><tspan x="750.0" dy="22.5">[Persona]</tspan><tspan x="750.0" dy="22.5"></tspan><tspan x="750.0" dy="22.5">Organiza contenidos y acompaña el</tspan><tspan x="750.0" dy="22.5">aprendizaje.</tspan></text><rect x="1040.0" y="200.0" width="380.0" height="190.0" rx="8" fill="#0B365B" stroke="none" stroke-width="1.5" /><text x="1230.0" y="256.75" text-anchor="middle" font-family="DejaVu Sans" font-size="18.0" font-weight="normal" fill="#FFFFFF"><tspan x="1230.0" dy="0">Administrador</tspan><tspan x="1230.0" dy="22.5">[Persona]</tspan><tspan x="1230.0" dy="22.5"></tspan><tspan x="1230.0" dy="22.5">Gestiona accesos y supervisa</tspan><tspan x="1230.0" dy="22.5">acciones.</tspan></text><rect x="450.0" y="535.0" width="600.0" height="225.0" rx="8" fill="#1672B8" stroke="none" stroke-width="1.5" /><text x="750.0" y="592.5" text-anchor="middle" font-family="DejaVu Sans" font-size="20.0" font-weight="normal" fill="#FFFFFF"><tspan x="750.0" dy="0">APU GO</tspan><tspan x="750.0" dy="25.0">[Sistema de software]</tspan><tspan x="750.0" dy="25.0"></tspan><tspan x="750.0" dy="25.0">Plataforma Web y Android para aprender quechua</tspan><tspan x="750.0" dy="25.0">chanka</tspan><tspan x="750.0" dy="25.0">con actividades, gamificación y seguimiento académico.</tspan></text><rect x="1090.0" y="545.0" width="350.0" height="210.0" rx="8" fill="#6B7280" stroke="none" stroke-width="1.5" /><text x="1265.0" y="611.75" text-anchor="middle" font-family="DejaVu Sans" font-size="18.0" font-weight="normal" fill="#FFFFFF"><tspan x="1265.0" dy="0">Groq: API externa de IA</tspan><tspan x="1265.0" dy="22.5">[Sistema externo obligatorio]</tspan><tspan x="1265.0" dy="22.5"></tspan><tspan x="1265.0" dy="22.5">Proporciona tutoría contextualizada</tspan><tspan x="1265.0" dy="22.5">y apoya recomendaciones.</tspan></text><rect x="60.0" y="860.0" width="1380.0" height="85.0" rx="8" fill="#F1F5F9" stroke="none" stroke-width="1.5" /><text x="74.0" y="898.25" text-anchor="start" font-family="DejaVu Sans" font-size="17.0" font-weight="normal" fill="#334155"><tspan x="74.0" dy="0">AZUL OSCURO: persona AZUL: sistema principal GRIS: sistema externo</tspan><tspan x="74.0" dy="21.25">Líneas continuas: integración obligatoria con Groq. Las flechas representan interacciones.</tspan></text><rect x="60.0" y="965.0" width="1380.0" height="90.0" rx="8" fill="#FFFFFF" stroke="none" stroke-width="1.5" /><text x="74.0" y="1006.0" text-anchor="start" font-family="DejaVu Sans" font-size="16.0" font-weight="normal" fill="#64748B"><tspan x="74.0" dy="0">Groq es obligatorio para el tutor IA (RF14). Las recomendaciones de refuerzo corresponden a RF07.</tspan><tspan x="74.0" dy="20.0">No se envían datos identificables de estudiantes. API, módulos, PostgreSQL y multimedia se detallan en niveles posteriores.</tspan></text><rect x="297.0859375" y="436.0" width="215.828125" height="53" fill="white"/><text x="405.0" y="452.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#334155"><tspan x="405.0" dy="0">Consulta lecciones, responde</tspan><tspan x="405.0" dy="15">actividades</tspan><tspan x="405.0" dy="15">y revisa progreso, puntos y logros</tspan></text><rect x="638.828125" y="407.25" width="222.34375" height="38" fill="white"/><text x="750.0" y="423.25" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#334155"><tspan x="750.0" dy="0">Gestiona contenidos y actividades;</tspan><tspan x="750.0" dy="15">consulta reportes</tspan></text><rect x="1011.2265625" y="443.5" width="167.546875" height="38" fill="white"/><text x="1095.0" y="459.5" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#334155"><tspan x="1095.0" dy="0">Gestiona usuarios y roles;</tspan><tspan x="1095.0" dy="15">consulta auditoría</tspan></text><rect x="1077.59375" y="496.0" width="99.8125" height="38" fill="white"/><text x="1127.5" y="512.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#334155"><tspan x="1127.5" dy="0">Solicita tutoría</tspan><tspan x="1127.5" dy="15">Datos filtrados</tspan></text><rect x="1059.96875" y="801.0" width="135.0625" height="38" fill="white"/><text x="1127.5" y="817.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#334155"><tspan x="1127.5" dy="0">Devuelve</tspan><tspan x="1127.5" dy="15">asistencia educativa</tspan></text></svg>
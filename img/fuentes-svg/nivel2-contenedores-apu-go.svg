.0" dy="21.25">dispositivos Android.</tspan></text><rect x="720.0" y="500.0" width="360.0" height="175.0" rx="8" fill="#1672B8" stroke="none" stroke-width="1.5" /><text x="900.0" y="540.75" text-anchor="middle" font-family="DejaVu Sans" font-size="17.0" font-weight="normal" fill="#FFFFFF"><tspan x="900.0" dy="0">Backend modular</tspan><tspan x="900.0" dy="21.25">[Contenedor · API REST]</tspan><tspan x="900.0" dy="21.25"></tspan><tspan x="900.0" dy="21.25">Autorización, casos de uso y reglas de</tspan><tspan x="900.0" dy="21.25">aprendizaje. Una sola aplicación</tspan><tspan x="900.0" dy="21.25">desplegable.</tspan></text><rect x="420.0" y="790.0" width="320.0" height="160.0" rx="8" fill="#1672B8" stroke="#0B365B" stroke-width="1.5" /><text x="580.0" y="833.875" text-anchor="middle" font-family="DejaVu Sans" font-size="17.0" font-weight="normal" fill="#FFFFFF"><tspan x="580.0" dy="0">PostgreSQL</tspan><tspan x="580.0" dy="21.25">[Contenedor · Base de datos]</tspan><tspan x="580.0" dy="21.25"></tspan><tspan x="580.0" dy="21.25">Usuarios, actividades, respuestas,</tspan><tspan x="580.0" dy="21.25">progreso, puntos y auditoría.</tspan></text><rect x="1090.0" y="790.0" width="320.0" height="160.0" rx="8" fill="#DBEAFE" stroke="#1672B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1250.0" y="833.875" text-anchor="middle" font-family="DejaVu Sans" font-size="17.0" font-weight="normal" fill="#0B365B"><tspan x="1250.0" dy="0">Redis</tspan><tspan x="1250.0" dy="21.25">[Contenedor · Caché opcional]</tspan><tspan x="1250.0" dy="21.25"></tspan><tspan x="1250.0" dy="21.25">Datos frecuentes; incorporación</tspan><tspan x="1250.0" dy="21.25">según mediciones.</tspan></text><rect x="750.0" y="910.0" width="320.0" height="150.0" rx="8" fill="#1672B8" stroke="none" stroke-width="1.5" /><text x="910.0" y="948.875" text-anchor="middle" font-family="DejaVu Sans" font-size="17.0" font-weight="normal" fill="#FFFFFF"><tspan x="910.0" dy="0">Almacenamiento de objetos</tspan><tspan x="
" width="280.0" height="95.0" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" stroke-dasharray="7 5"/><text x="590.0" y="1213.5" text-anchor="middle" font-family="DejaVu Sans" font-size="16.0" font-weight="normal" fill="#142E40"><tspan x="590.0" dy="0">Redis</tspan><tspan x="590.0" dy="20.0">[Contenedor · Caché opcional]</tspan></text><rect x="760.0" y="1170.0" width="330.0" height="95.0" rx="8" fill="#6B7280" stroke="#64748B" stroke-width="1.5" /><text x="925.0" y="1213.5" text-anchor="middle" font-family="DejaVu Sans" font-size="16.0" font-weight="normal" fill="#FFFFFF"><tspan x="925.0" dy="0">Almacenamiento de objetos</tspan><tspan x="925.0" dy="20.0">[Contenedor · Audios e imágenes]</tspan></text><rect x="1130.0" y="1170.0" width="350.0" height="95.0" rx="8" fill="#6B7280" stroke="#64748B" stroke-width="1.5" /><text x="1305.0" y="1213.5" text-anchor="middle" font-family="DejaVu Sans" font-size="16.0" font-weight="normal" fill="#FFFFFF"><tspan x="1305.0" dy="0">Groq: API externa de IA</tspan><tspan x="1305.0" dy="20.0">[Sistema externo obligatorio]</tspan></text><rect x="60.0" y="1320.0" width="1480.0" height="105.0" rx="8" fill="#FFFFFF" stroke="none" stroke-width="1.5" /><text x="74.0" y="1350.0" text-anchor="start" font-family="DejaVu Sans" font-size="15.0" font-weight="normal" fill="#142E40"><tspan x="74.0" dy="0">Las flechas representan colaboración en ejecución. Los casos de uso utilizan contratos; los adaptadores los implementan.</tspan><tspan x="74.0" dy="18.75">Los tres grupos son ayudas visuales: no son componentes adicionales ni servicios independientes.</tspan><tspan x="74.0" dy="18.75">Los repositorios mantienen la responsabilidad de cada módulo sobre sus datos. CDN y descarga multimedia del cliente se muestran en C2.</tspan><tspan x="74.0" dy="18.75">Líneas discontinuas: Redis opcional. Groq obligatorio. Arquitectura objetivo pendiente de implementación.</tspan></text><rect x="754.1875" y="202.25" width="91.625" height="23" fill="white"/><